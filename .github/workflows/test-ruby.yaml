name: Test

permissions: {}

on:
  push:
    branches:
      - main
      - renovate
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # every day at midnight UTC

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        gemfile:
          - activesupport-7-0
          - activesupport-7-1
          - activesupport-7-2
          - activesupport-8-0
          - minitest-5
          - minitest-6
          - plain-ruby
          - rspec-3
          - test-unit-3

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Run test scenarios
        run: ./test-gemfile ./gemfiles/${{ matrix.gemfile }}
        shell: bash
